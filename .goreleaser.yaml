version: 2
project_name: repodungeon
builds:
  - main: .
    binary: repodungeon
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X main.version={{.Version}}"]
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
# Publishes a cask to the dpologdvinity/homebrew-tap repo on every release.
# Needs the HOMEBREW_TAP_TOKEN secret (see release.yml).
homebrew_casks:
  - repository:
      owner: dpologdvinity
      name: homebrew-tap
      branch: master
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/dpologdvinity/repodungeon"
    description: "A roguelike generated from your git repository"
    license: "MIT"

# .deb and .rpm packages. The release workflow publishes the .deb files in a
# signed apt repository (see scripts/build-apt-repo.sh).
nfpms:
  - id: packages
    package_name: repodungeon
    vendor: Kaitlyn Bassford
    maintainer: Kaitlyn Bassford <dpologdvinity@users.noreply.github.com>
    homepage: https://github.com/dpologdvinity/repodungeon
    description: A roguelike generated from your git repository.
    license: MIT
    formats: [deb, rpm]
    dependencies: [git]
    section: games
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Arch }}"
