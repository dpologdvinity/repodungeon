# Continuous integration: dependencies, lint, tests with coverage, build.
# Every third-party action is pinned to a full commit SHA (version in the comment).
name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A newer push to the same ref cancels the older, still-running run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Minimum total statement coverage, in percent.
  MIN_COVERAGE: "85"

jobs:
  # 1. Check that dependencies download, verify and are tidy. setup-go caches
  #    the module and build caches for every job that uses it.
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: go mod download
      - run: go mod verify
      - name: go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  # 2. Format, vet and static analysis (golangci-lint includes staticcheck,
  #    errcheck and the type-aware linters), plus known-vulnerability scan.
  lint:
    needs: deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.15.0
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # 3. Full test suite with the race detector and coverage. Fails fast: one
  #    failing OS cancels the other.
  test:
    needs: deps
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Coverage report and threshold
        shell: bash
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          {
            echo "### Coverage (${{ matrix.os }})"
            echo
            echo "Total: **${total}%** (minimum ${MIN_COVERAGE}%)"
            echo
            echo '```'
            go tool cover -func=coverage.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          awk -v t="$total" -v m="$MIN_COVERAGE" 'BEGIN { exit !(t+0 >= m+0) }'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.out

  # 4. Build every release artifact (all OS/arch targets) without publishing.
  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: "~> v2"
          args: check
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: "~> v2"
          args: build --snapshot --clean
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: binaries
          path: dist/*/repodungeon*
          retention-days: 7

  # 5. Build the .deb/.rpm packages and the apt repository with a throwaway
  #    key, so a broken packaging setup is caught before a release.
  packages:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: sudo apt-get install -y --no-install-recommends dpkg-dev apt-utils shellcheck
      - run: shellcheck scripts/build-apt-repo.sh
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
      - name: Build the apt repository with a throwaway key
        run: |
          export GNUPGHOME="$(mktemp -d)"
          gpg --batch --pinentry-mode loopback --passphrase '' --quick-generate-key "ci <ci@example.com>" ed25519 sign never
          key=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
          mkdir debs && cp dist/*.deb debs/
          scripts/build-apt-repo.sh debs "$RUNNER_TEMP/repo" "$key"
          gpg --verify "$RUNNER_TEMP/repo/dists/stable/Release.gpg" "$RUNNER_TEMP/repo/dists/stable/Release"
          for arch in amd64 arm64; do
            grep -q '^Package: repodungeon' "$RUNNER_TEMP/repo/dists/stable/main/binary-$arch/Packages"
          done
